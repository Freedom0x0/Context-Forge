[project]
name = "context-forge"
version = "1.0.0"
description = "Local-first continuous-learning memory system for agents"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.0,<3.0",
  "typer>=0.12,<1.0",
  "python-frontmatter>=1.1,<2.0",
  "httpx>=0.27,<1.0",
  "tomli-w>=1.0,<2.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0,<2.0"]
semantic = ["numpy>=1.26", "sentence-transformers>=3,<4"]
liveness = ["psutil>=5.9,<8"]
watch = ["watchdog>=4,<7"]

[project.scripts]
forge = "context_forge.cli:app"
forge-mcp = "context_forge.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
include = ["context_forge*"]
exclude = ["evals*", "assets*", "tests*", "docs*"]
